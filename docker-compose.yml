version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orio-inventory-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistent volume for SQLite database storage
      - ./data:/app/data
    environment:
      - PORT=8080
      - JAVA_OPTS=-Xms128m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/products || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
